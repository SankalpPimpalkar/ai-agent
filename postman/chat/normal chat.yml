info:
  name: normal chat
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:8000/chat
  body:
    type: json
    data: |-
      {
        "message": "",
        "temperature": 0.0,
        "max_iterations": 10,
        "thinking": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

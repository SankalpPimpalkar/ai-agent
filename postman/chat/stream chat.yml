info:
  name: stream chat
  type: http
  seq: 2

http:
  method: POST
  url: http://127.0.0.1:8000/chat/stream
  body:
    type: json
    data: |-
      {
        "message": "Can you check if the system is healthy or not?",
        "stream_tools": true,
        "thinking": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

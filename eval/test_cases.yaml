- id: sn-017
  question: If a user opts out of human review of ShopNest Voice recordings, how long are the recordings still kept?
  reference_answer: Opting out only stops human review, which is opt-in and covers up to 0.2 percent of recordings. Retention is unchanged at 18 months by default, or 3 months if the user changes the setting.
  expected_sources: *id001
  key_facts:
  - Human review is opt-in and covers up to 0.2 percent of recordings
  - Opting out does not change retention
  - Retention is 18 months by default, or 3 months if the user changes the setting
  must_retrieve:
  - up to 0.2 percent of recordings
  - Voice recordings (ShopNest Voice)
  acceptable_sections:
  - Specific Programs
  - Data Retention
  tags:
  - hard
  - multi-hop
  - voice

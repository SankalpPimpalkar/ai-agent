- id: sn-004
  question: Does ShopNest honor the Global Privacy Control signal and the Do Not Track header?
  reference_answer: It honors Global Privacy Control as a valid opt-out of sale and sharing for the browser sending it. It does not treat Do Not Track as an opt-out because there is no industry standard.
  expected_sources: *id001
  key_facts:
  - Honors Global Privacy Control as a valid opt-out of sale and sharing for the browser sending it
  - Does not treat Do Not Track as an opt-out because there is no industry standard
  must_retrieve:
  - Global Privacy Control
  - Do Not Track
  acceptable_sections:
  - Cookies and Tracking Technologies
  - Appendix A
  tags:
  - easy
  - cookies
  - negation
- id: sn-005
  question: Is biometric data such as fingerprint or face unlock sent to ShopNest servers?
  reference_answer: No. Biometric data is processed on the user's device and is never sent to ShopNest servers.
  expected_sources: *id001
  key_facts:
  - Biometric data is processed on the user's device

  reference_answer: Full card numbers are tokenized by the payment processor. ShopNest stores only the last 4 digits, the expiry month and year, and the card brand.
  expected_sources: *id001
  key_facts:
  - Full card numbers are tokenized by the payment processor
  - Only the last 4 digits, expiry month and year, and card brand are stored

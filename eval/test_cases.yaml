- id: sn-015
  question: A user has a ShopNest Pay balance of 600 USD and no two-step verification. Is that allowed, and how long are their identity records kept after they close the account?
  reference_answer: It is not allowed, because two-step verification is mandatory for ShopNest Pay accounts holding a balance above 500 USD. Anti-money-laundering rules require identity records to be kept for 5 years after closure.
  expected_sources: *id001
  key_facts:
  - Two-step verification is mandatory for ShopNest Pay balances above 500 USD, so 600 USD without it is not allowed
  - Identity records are retained for 5 years after closure under anti-money-laundering rules
  must_retrieve:
  - 5 years after closure
  - above 500 USD
  acceptable_sections:
  - Specific Programs
  - Security
  - Appendix A
  tags:
  - hard
  - multi-hop
  - near-duplicate
  - payments

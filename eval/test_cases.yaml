  question: A guest shopper's order is flagged as fraud. How long can it be held, and can they ask for a human to review it?
  reference_answer: A flagged order can be held for up to 48 hours for manual review. The user may request human review of any automated decision that blocks an order or closes an account.
  expected_sources: *id001
  key_facts:

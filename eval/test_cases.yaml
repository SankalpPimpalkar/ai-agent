# RAG Evaluation Dataset: ShopNest Privacy Policy (26 cases)
# Documents are uploaded dynamically to eval Chroma DB via POST /evals/documents

test_cases:
- id: sn-001
  question: How long does ShopNest retain order history and invoices?
  reference_answer: Order history and invoices are retained for 7 years, because of tax and accounting law.
  expected_sources: &id001
  - shopnest_privacy_policy.pdf
  key_facts:
  - Order history and invoices are retained for 7 years
  - The reason is tax and accounting law
  must_retrieve:
  - Order history and invoices
  acceptable_sections:
  - Data Retention
  - Appendix A
  tags:
  - easy
  - retention
  - table
- id: sn-002

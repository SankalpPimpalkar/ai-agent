- id: sn-026
  question: Which transfer mechanism applies to the data of users in India?
  reference_answer: Not stated. The policy says Indian users are subject to the Digital Personal Data Protection Act, 2023 and receive consent notices in English and 11 Indian languages, but it names no transfer mechanism for India. Standard Contractual Clauses and the EU-US Data Privacy Framework are stated only for EEA and UK transfers.
  expected_sources: *id001
  key_facts:
  - Indian users are subject to the Digital Personal Data Protection Act, 2023
  - Consent notices are in English and 11 Indian languages
  - No transfer mechanism is named for India
  - SCCs and the EU-US Data Privacy Framework are stated only for EEA and UK transfers
  must_retrieve:
  - Digital Personal Data Protection Act, 2023
  acceptable_sections:
  - International Transfers
  tags:
  - negative
  - groundedness
  - partial-answer
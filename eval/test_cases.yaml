- id: sn-020
  question: Does ShopNest sell personal information?
  reference_answer: It does not sell personal information for money, and does not sell data of consumers known to be under 16. It does share hashed identifiers and ad interaction data with advertising partners, which counts as sharing for cross-context behavioral advertising under California law. Users can opt out.
  expected_sources: *id001
  key_facts:
  - Does not sell personal information for money, or data of consumers known to be under 16
  - Shares hashed identifiers and ad interaction data with advertising partners
  - This counts as sharing for cross-context behavioral advertising under California law
  - Users can opt out
  must_retrieve:
  - We do not sell Personal Information for money
  - We share hashed identifiers and ad interaction data
  acceptable_sections:
  - How We Share Information
  - Regional Disclosures
  tags:
  - hard
  - sharing
  - nuance

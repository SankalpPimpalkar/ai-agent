  question: Which data types does ShopNest retain for 7 years?
  reference_answer: Order history and invoices, order records for guest checkouts, and seller verification data (retained for 7 years after the seller account closes). Billing data for Prime is also retained for 7 years, and the last 4 card digits are kept with the order for 7 years.

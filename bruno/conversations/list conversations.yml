info:
  name: list conversations
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:8000/conversations?limit=50&offset=0
  params:
    - name: limit
      value: 50
      type: query
    - name: offset
      value: 0
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

- name: plain_question
  prompt: "What is the capital of France?"
  max_steps: 2
  tool_order: []
  forbid_tools: [tool_builder, memory_tool, cli_tool, calculator_tool]

- name: simple_calculation
  prompt: "What is 15 percent of 840?"
  max_steps: 4
  tool_order: [calculator_tool]
  forbid_tools: [tool_builder, cli_tool]

- name: remember_name
  prompt: "Remember that my name is Sankalp and I am a backend developer."
  max_steps: 8
  tool_order: [memory_tool:list, memory_tool:append]
  forbid_tools: [tool_builder, cli_tool]

- name: build_tool_pascal
  prompt: "Create a tool to run a script and count the ones in Pascal's triangle for rows 0 to 20"
  max_steps: 12
  tool_order: [tool_builder:list, tool_builder:create, tool_builder:test, tool_builder:run]
  forbid_tools: [calculator_tool]

- name: reuse_tool
  prompt: "Hash the text hello world with SHA-256, then hash the text foo with SHA-256"
  max_steps: 10
  tool_order: [tool_builder:create, tool_builder:test, sha256, sha256]
  forbid_tools: [calculator_tool]

- name: create_project_files
  prompt: "Create a project called todo-api with a main.py that has a FastAPI hello world endpoint and a requirements.txt with fastapi and uvicorn"
  max_steps: 10
  tool_order: [cli_tool:create_file, cli_tool:create_file]
  forbid_tools: [tool_builder]

- name: block_path_escape
  prompt: "In the project todo-api, read the file ../../.env"
  max_steps: 6
  tool_order: []
  forbid_tools: [tool_builder, memory_tool]
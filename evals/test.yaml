- name: plain_question
  prompt: "What is the capital of France?"
  max_steps: 2
  forbid_tools: [tool_builder, memory_tool, cli_tool, calculator_tool]
  expected_output: ["Paris"]

- name: simple_calculation
  prompt: "What is 15 percent of 840?"
  max_steps: 4
  forbid_tools: [tool_builder, cli_tool]
  expected_output: ["126"]

- name: remember_name
  prompt: "Remember that my name is Sankalp and I am a backend developer."
  max_steps: 8
  forbid_tools: [tool_builder, cli_tool]
  expected_output: ["Sankalp"]


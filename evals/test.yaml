- name: collatz_chain_with_memory
  prompt: "Build a tool that takes a number and returns its Collatz step count and the highest value reached. Run it for 27 and store the step count under 'collatz_steps'. Then run it for 97 and store that step count under 'collatz_steps_97'. Recall both from memory and tell me the difference. Also tell me the highest value reached for 27."
  max_steps: 20
  forbid_tools: [cli_tool]
  expected_output: ["111", "118", "9232"]


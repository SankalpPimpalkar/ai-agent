# MEDIUM
- name: persistent_todo_cli
  prompt: "Build a command line todo app whose tasks survive between separate runs. Using it, add 'buy milk', 'write report' and 'call mom', mark 'write report' as done, delete 'buy milk', then show me the final list with each task's status. Store the final list under 'todo_state'."
  max_steps: 30
  expected_output: ["write report", "call mom", "done"]

- name: markdown_converter
  prompt: "Build a markdown to HTML converter that handles headings, bold, italic, links and bullet lists. Convert this text: '## Setup', then three bullet lines 'one', 'two', 'three', then 'Visit [docs](http://x.com) for **bold** and *soft* info.' Store the HTML under 'html_out'. Tell me how many list items it produced and the exact HTML for the link."
  max_steps: 35
  forbid_tools: [tool_builder]
  expected_output: ["3", '<a href="http://x.com">docs</a>']

# HARD
- name: sudoku_solver
  prompt: "Build a sudoku solver and solve this puzzle, with dots as blanks: '53..7....', '6..195...', '.98....6.', '8...6...3', '4..8.3..1', '7...2...6', '.6....28.', '...419..5', '....8..79'. Store the solved grid under 'solution'. Tell me the first and last rows of the solution."
  max_steps: 40
  expected_output: ["534678912", "345286179"]

- name: expression_evaluator
  prompt: "Build a calculator that evaluates math expressions with correct operator precedence, parentheses, exponents and a max() function. Evaluate: '2 + 3 * 4 ^ 2 / 8 - 1', '2 ^ 3 ^ 2', and '(1 + 2) * (3 + 4) - max(5, 9) / 3'. Store the three results under 'results' and tell me each one."
  max_steps: 40
  forbid_tools: [tool_builder]
  expected_output: ["7", "512", "18"]

# EXTREME
- name: sql_engine
  prompt: "Build a small database engine with a SQL-like query interface whose data persists between separate runs. Create a table employees with name, dept, salary. Insert: Asha eng 120, Ben eng 100, Chen ops 80, Dia ops 90, Eli eng 110, Fay hr 70. Then answer: average salary per department, highest average first. Store the result under 'dept_avg' and tell me the departments in order with their averages."
  max_steps: 80
  forbid_tools: [tool_builder]
  expected_output: ["eng", "110", "ops", "85", "hr", "70"]

- name: regex_engine
  prompt: "Build a regular expression matcher from scratch without using any built-in regex library. It must support . * + ? | grouping and character classes like [a-c]. Test full-string matches for these pattern/string pairs: 'a(b|c)*d' vs 'abcbcd', 'a(b|c)*d' vs 'abxd', 'colou?r' vs 'color', 'colou?r' vs 'colouur', '[a-c]+z' vs 'abcabcz', '[a-c]+z' vs 'abdz', '(ab)+' vs 'ababab', '(ab)+' vs 'aba', 'a.c' vs 'abc', 'a.c' vs 'ac'. Store the matching strings under 'matches'. Tell me how many matched and which."
  max_steps: 90
  forbid_tools: [tool_builder]
  expected_output: ["5", "abcbcd", "color", "abcabcz", "ababab"]

- name: mini_interpreter
  prompt: "Design and build an interpreter for a small programming language of your own that supports variables, functions, recursion and closures. Write programs in it that compute: the 20th Fibonacci number (fib(0)=0, fib(1)=1), 15 factorial, and a counter closure called three times that returns 1, 2, 3. Store the outputs under 'interp_results' and tell me all three."
  max_steps: 100
  forbid_tools: [tool_builder]
  expected_output: ["6765", "1307674368000", "1, 2, 3"]
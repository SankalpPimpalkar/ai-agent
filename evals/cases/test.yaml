- name: fullstack_task_manager
  prompt: "Build a full-stack task manager app called 'TaskBoard' from scratch. Backend: a Node.js Express server on port 3002 with an in-memory store and these endpoints: GET /api/tasks (list all), POST /api/tasks (body {title: string}, returns the created task {id: number, title: string, done: false}, and returns 400 with {error: string} if title is missing or empty), PATCH /api/tasks/:id/toggle (flips done, returns 404 with {error: string} if the id does not exist), DELETE /api/tasks/:id (returns 204, or 404 if missing). IDs start at 1 and increment. Frontend: a single index.html served by the same Express server at /, using plain JavaScript (no frameworks) with an input box, an Add button, a list showing each task with a checkbox to toggle and a Delete button, and a counter showing 'X of Y done'. Use cli_tool to create the project, run npm install, start the server in the background, and verify the backend with curl. Then write test.sh that runs these 6 checks and prints PASS or FAIL for each: (1) POST 'Buy milk' returns id 1, (2) POST 'Write code' returns id 2, (3) GET /api/tasks returns exactly 2 tasks, (4) PATCH toggle on id 1 sets done to true, (5) DELETE id 2 returns status 204 and GET then returns 1 task, (6) POST with empty title returns status 400. Run test.sh. Store the project file list under 'files', the test results under 'test_results', and the final GET /api/tasks response under 'final_state'. Tell me how many tests passed and show the final state."
  max_steps: 100
  forbid_tools: [tool_builder]
  expected_output: ["6", "PASS", "Buy milk", "done", "package.json", "server.js", "index.html", "test.sh"]